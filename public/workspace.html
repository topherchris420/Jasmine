<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jasmine | Studio</title><link rel="stylesheet" href="/workspace.css"><script type="module" src="/workspace.js"></script></head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="organization"><a href="/" class="logo" aria-label="Jasmine home">◈</a><button id="organization">Jasmine Organization⌄</button><button id="collapse" title="Collapse sidebar">◧</button></div>
  <div class="create-row"><button id="create" class="black">＋ Create</button><button id="search" title="Search flows">⌕</button></div>
  <nav aria-label="Workspace"><small>Build</small><button data-view="flows" class="active">♧ <span>Flows</span><i id="flow-count"></i></button><button data-view="prompts">▤ <span>Prompts</span></button><button data-view="data">▱ <span>Data</span></button><button data-view="connections">♧ <span>Connections</span><i>›</i></button><small>Deploy</small><button data-view="deployments">♧ <span>Deployments</span></button><button data-view="jobs">◷ <span>Jobs</span></button><button data-view="playground">›_ <span>API Playground</span></button><small>Monitor</small><button data-view="logs">▤ <span>Logs</span></button><button data-view="reports">▥ <span>Reports</span></button></nav>
  <div class="sidebar-bottom"><button id="help">ⓘ Help</button><button id="settings">⚙ Settings</button><div class="profile"><span>J</span><div>Jasmine Classroom<small>Local workspace</small></div></div></div>
</aside>
<main>
  <header class="project-header"><button id="project">▱ Jasmine Project ⌄</button><button id="github">◉ GitHub</button><div class="header-right"><button id="api-docs">♧ API Docs</button><span id="deployment-status" class="deployment">Not deployed</span><button id="deploy" class="black">Deploy ♧</button><span class="brand-diamond">◆</span></div></header>
  <section id="list-view" class="list-view"></section>
  <section id="editor-view" hidden>
    <header class="flow-header"><button id="back" title="Back to flows">☰</button><span class="enabled">●</span><input id="flow-name" aria-label="Flow name"><button id="tags">+ Tags</button><span id="updated" class="updated"></span><button id="more" title="Flow actions">⋯</button><div class="tabs" role="tablist"><button data-tab="editor" class="selected" role="tab">Editor</button><button data-tab="logs" role="tab">Logs</button><button data-tab="reports" role="tab">Reports</button></div><div class="flow-actions"><button id="setup">〈〉 Setup</button><button id="save">▣ Saved</button><button id="config">Config ◉</button></div></header>
    <div id="canvas" class="canvas" tabindex="0" aria-label="Workflow canvas"><div id="graph" class="graph"><svg id="edges" aria-label="Node connections"></svg><div id="notes"></div><div id="nodes"></div></div><div id="minimap" class="minimap"></div><div id="empty" class="empty" hidden>Add a trigger to begin your flow.</div></div>
    <div id="report-view" class="report-view" hidden></div>
    <footer class="toolbar"><button id="undo" title="Undo (Ctrl+Z)">↶</button><button id="redo" title="Redo (Ctrl+Shift+Z)">↷</button><span class="divider"></span><button id="zoom-in" title="Zoom in">＋</button><button id="zoom-out" title="Zoom out">−</button><button id="fit" title="Fit view">⛶</button><button id="add-note" title="Add note">▰</button><button id="templates">▦ Templates</button><span class="toolbar-spacer"></span><button id="debug">◷ Debug</button><button id="test" class="black">▶ Test</button><button id="show-test" title="Toggle test panel">⌃</button></footer>
  </section>
</main>
<aside id="inspector" class="inspector" hidden><header><strong id="inspector-title"></strong><button id="close-inspector" aria-label="Close configuration">×</button></header><div id="inspector-body"></div></aside>
<aside id="test-panel" class="test-panel" hidden><header><strong>Test Flow</strong><button id="close-test" aria-label="Close test panel">×</button></header><div class="test-body"><label for="payload">Input payload</label><textarea id="payload" spellcheck="false">{"message":"Explain multi-factor authentication in two sentences."}</textarea><div class="test-actions"><button id="run" class="black">▶ Run</button><button id="cancel" disabled>Cancel</button><span id="run-status" role="status"></span></div><div id="test-output" aria-live="polite"></div></div></aside>
<dialog id="dialog"><header><strong id="dialog-title"></strong><button id="close-dialog" aria-label="Close dialog">×</button></header><div id="dialog-body"></div></dialog>
<input id="import-file" type="file" accept=".json,application/json" hidden>
<div id="toast" class="toast" role="status" hidden></div>
</body></html>
