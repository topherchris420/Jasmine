<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/apps/apps.css">
  <script type="module" src="/apps/chat.js"></script>
</head>
<body>
  <div class="chat" id="chat">
    <header class="chat-head">
      <span class="avatar" id="avatar" aria-hidden="true">J</span>
      <span class="title" id="title">Chat</span>
      <button type="button" id="reset" title="Start a new conversation" aria-label="Start a new conversation">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg>
      </button>
      <button type="button" id="close" title="Close" aria-label="Close chat" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="chat-log" id="log" role="log" aria-live="polite"></div>
    <div class="suggestions" id="suggestions"></div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Type a message…" aria-label="Message" maxlength="20000"></textarea>
      <button type="submit" id="send" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div class="foot">Powered by Jasmine · runs on local AI</div>
  </div>
</body>
</html>
