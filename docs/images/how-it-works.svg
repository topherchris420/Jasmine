<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="How Jasmine works: describe what you want, review the proposed plan, test it on your own model, then deploy when you decide.">
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071f24"/><stop offset="1" stop-color="#0b4249"/></linearGradient>
<linearGradient id="line"><stop stop-color="#31bca1"/><stop offset="1" stop-color="#a0e9de"/></linearGradient>
<pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#98dacf" opacity=".1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a0e9de"/></marker>
</defs>
<rect width="1200" height="230" rx="20" fill="url(#bg)"/>
<rect width="1200" height="230" rx="20" fill="url(#grid)"/>
<circle cx="1060" cy="-40" r="200" fill="#27b4a0" opacity=".055"/>
<g fill="none" stroke="url(#line)" stroke-width="2" marker-end="url(#arrow)">
<path d="M300 110h46"/><path d="M580 110h46"/><path d="M860 110h46"/>
</g>
<g font-family="system-ui,sans-serif">
<rect x="70" y="50" width="230" height="120" rx="14" fill="#163b40" stroke="#3d7778"/>
<circle cx="98" cy="78" r="12" fill="#225951" stroke="#8de2c7"/><text x="98" y="83" font-size="13" font-weight="700" fill="#effff5" text-anchor="middle">1</text>
<text x="118" y="83" font-size="12" font-weight="600" letter-spacing="2" fill="#8cc8c0">DESCRIBE</text>
<text x="86" y="114" font-size="19" font-weight="700" fill="#f2fff9">Say what you want</text>
<text x="86" y="138" font-size="13" fill="#a9d4cd">In plain words, or start</text>
<text x="86" y="156" font-size="13" fill="#a9d4cd">from a template.</text>

<rect x="350" y="50" width="230" height="120" rx="14" fill="#163b40" stroke="#5db3a4"/>
<circle cx="378" cy="78" r="12" fill="#225951" stroke="#8de2c7"/><text x="378" y="83" font-size="13" font-weight="700" fill="#effff5" text-anchor="middle">2</text>
<text x="398" y="83" font-size="12" font-weight="600" letter-spacing="2" fill="#8cc8c0">REVIEW</text>
<text x="366" y="114" font-size="19" font-weight="700" fill="#f2fff9">Check the plan</text>
<text x="366" y="138" font-size="13" fill="#a9d4cd">Real steps and a readiness</text>
<text x="366" y="156" font-size="13" fill="#a9d4cd">list. Nothing is created yet.</text>

<rect x="630" y="50" width="230" height="120" rx="14" fill="#163b40" stroke="#5db3a4"/>
<circle cx="658" cy="78" r="12" fill="#225951" stroke="#8de2c7"/><text x="658" y="83" font-size="13" font-weight="700" fill="#effff5" text-anchor="middle">3</text>
<text x="678" y="83" font-size="12" font-weight="600" letter-spacing="2" fill="#8cc8c0">TEST</text>
<text x="646" y="114" font-size="19" font-weight="700" fill="#f2fff9">Run it on your model</text>
<text x="646" y="138" font-size="13" fill="#a9d4cd">Watch every step, its timing</text>
<text x="646" y="156" font-size="13" fill="#a9d4cd">and tokens, as it runs.</text>

<rect x="910" y="50" width="230" height="120" rx="14" fill="#225951" stroke="#8de2c7"/>
<circle cx="938" cy="78" r="12" fill="#163b40" stroke="#8de2c7"/><text x="938" y="83" font-size="13" font-weight="700" fill="#effff5" text-anchor="middle">4</text>
<text x="958" y="83" font-size="12" font-weight="600" letter-spacing="2" fill="#a9edda">DEPLOY</text>
<text x="926" y="114" font-size="19" font-weight="700" fill="#f2fff9">Ship when you decide</text>
<text x="926" y="138" font-size="13" fill="#c2f0e2">API, chat widget, webhook</text>
<text x="926" y="156" font-size="13" fill="#c2f0e2">or schedule. Roll back anytime.</text>
</g>
<text x="600" y="206" font-family="system-ui,sans-serif" font-size="13" letter-spacing="2" fill="#80b6b2" text-anchor="middle">YOU APPROVE EVERY STEP · NOTHING GOES LIVE ON ITS OWN</text>
</svg>
